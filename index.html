<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>Ledger</title>
<link rel="icon" type="image/png" href="./assets/icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --canvas: #F4F1EA; --surface: #FFFFFF; --forest: #0E7955; --lime: #CCF244; --text: #181C1A; --muted: #5F5C56; --hairline: #E5E3DB; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--canvas); color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .wrap { width: 100%; max-width: 480px; margin: 0 auto; padding: 0 16px; }
  header { padding: 28px 0 20px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; }
  .brand-mark { width: 32px; height: 32px; border-radius: 9px; overflow: hidden; display: grid; place-items: center; }
  .brand-mark img { width: 100%; height: 100%; display: block; }
  main { flex: 1; display: flex; align-items: center; }
  .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 22px; padding: 32px 28px; width: 100%; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p.lead { color: var(--muted); margin: 0 0 24px; }
  .links { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .links a {
    display: block; padding: 14px 16px; border: 1px solid var(--hairline); border-radius: 14px;
    color: var(--text); text-decoration: none; font-weight: 500; background: var(--canvas);
  }
  .links a:hover { border-color: var(--forest); }
  footer { padding: 28px 0 32px; font-size: 13px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <header class="wrap">
    <span class="brand">
      <span class="brand-mark" aria-hidden="true">
        <img src="./assets/icon.png" width="32" height="32" alt="" />
      </span>
      Ledger
    </span>
  </header>
  <main class="wrap">
    <div class="card">
      <h1>Public pages for Ledger</h1>
      <p class="lead">A personal expense-tracking app.</p>
      <ul class="links">
        <li><a href="./privacy/">Privacy Policy</a></li>
        <li><a href="./terms/">Terms of Service</a></li>
        <li><a href="./delete-account/">Delete your account</a></li>
      </ul>
    </div>
  </main>
  <footer class="wrap">Ledger · theledgerapp.support@gmail.com</footer>
</body>
</html>
